name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, curl, pdo_sqlite, sqlite3
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Composer security audit
        run: composer audit
        continue-on-error: true

      - name: Run tests (Pest)
        run: php artisan test

      # schedule:list probes EventMutex::exists() per event; with CACHE_STORE=database
      # that hits MySQL cache_locks. CI has no MySQL — use array cache for this step only.
      - name: Show schedule list
        run: php artisan schedule:list
        env:
          CACHE_STORE: array

  # SQLite cannot exercise InnoDB locking, MySQL FK/index names, LAST_INSERT_ID
  # upserts, or real concurrent transactions. This job covers Transportation,
  # SeasonPilgrims, and S04 Suppliers & Procurement Feature + Concurrency.
  backend-mysql:
    name: Backend (MySQL 8 — Transport + S04)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_hajj_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: backend
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: erp_hajj_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, curl, pdo_mysql
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Assert disposable MySQL test database
        run: |
          test "${DB_DATABASE}" = "erp_hajj_testing"
          php -r 'exit(getenv("DB_DATABASE") === "erp_hajj_testing" ? 0 : 1);'

      - name: Assert S04 MySQL suite paths exist
        run: |
          test -d tests/Feature/SuppliersAndProcurement
          test -f tests/Concurrency/SupplierNumberConcurrencyTest.php
          test -f tests/Concurrency/SupplierDocumentRecordConcurrencyTest.php
          test -f tests/Concurrency/SupplierBankIbanClaimConcurrencyTest.php
          test -f tests/Concurrency/SupplierBankActionConcurrencyTest.php
          test -f tests/Concurrency/SupplierBankDeadlockConcurrencyTest.php
          test -f tests/Concurrency/SupplierCriteriaPackConcurrencyTest.php
          test -f tests/Concurrency/SupplierEvaluationConcurrencyTest.php
          test -f tests/Concurrency/TransportConcurrencyTest.php

      - name: Migrations (fresh; optional recent-batch remigrate)
        run: |
          php artisan migrate:fresh --force
          # NOTE (S04 drift): --step=31 no longer equals "Transportation + Accommodation".
          # After S04 it re-applies only the newest ~31 procurement migrations sitting
          # above the batch. Transport create migrations are NOT rolled back here.
          # Full Transport remigrate coverage is a separate Owner decision.
          php artisan migrate:rollback --step=31 --force
          php artisan migrate --force

      - name: Transportation and SeasonPilgrims tests (MySQL)
        run: php vendor/bin/pest -c phpunit.mysql.xml tests/Feature/Transportation tests/Feature/SeasonPilgrims

      - name: Transportation concurrency tests (MySQL)
        run: php vendor/bin/pest -c phpunit.mysql.xml tests/Concurrency/TransportConcurrencyTest.php

      - name: S04 Suppliers and Procurement Feature tests (MySQL)
        run: php vendor/bin/pest -c phpunit.mysql.xml tests/Feature/SuppliersAndProcurement

      # Sequential on shared erp_hajj_testing — ConcurrencyTestCase uses migrate:fresh.
      - name: S04 Supplier concurrency tests (MySQL, sequential)
        run: |
          php vendor/bin/pest -c phpunit.mysql.xml \
            tests/Concurrency/SupplierNumberConcurrencyTest.php \
            tests/Concurrency/SupplierDocumentRecordConcurrencyTest.php \
            tests/Concurrency/SupplierBankIbanClaimConcurrencyTest.php \
            tests/Concurrency/SupplierBankActionConcurrencyTest.php \
            tests/Concurrency/SupplierBankDeadlockConcurrencyTest.php \
            tests/Concurrency/SupplierCriteriaPackConcurrencyTest.php \
            tests/Concurrency/SupplierEvaluationConcurrencyTest.php

      - name: S05 procurement concurrency tests (MySQL, sequential)
        run: |
          php vendor/bin/pest -c phpunit.mysql.xml \
            tests/Concurrency/ProcurementRfqPublishConcurrencyTest.php \
            tests/Concurrency/ProcurementRfqSelectConcurrencyTest.php \
            tests/Concurrency/PurchaseOrderCreateConcurrencyTest.php \
            tests/Concurrency/GoodsReceiptPostConcurrencyTest.php \
            tests/Concurrency/PurchaseOrderCloseConcurrencyTest.php

      # S08 Seasonal Templates — MySQL 8 FK/JSON/nullable source_season + reminder rules.
      # migrate:fresh already applied 320002/320003 above; this step only asserts + tests.
      - name: Assert S08 MySQL migrations present
        run: |
          test -f database/migrations/2026_11_08_320002_s08_expand_templates_snapshots_and_optional_source.php
          test -f database/migrations/2026_11_08_320003_create_season_reminder_rules_table.php
          php artisan tinker --execute="echo Schema::hasTable('season_reminder_rules') ? 'ok' : exit(1);"

      - name: S08 SeasonalTemplates Feature tests (MySQL 8)
        run: php vendor/bin/pest -c phpunit.mysql.xml --filter=SeasonalTemplates

      - name: S08 Contract placeholder Control C (MySQL 8)
        run: |
          php vendor/bin/pest -c phpunit.mysql.xml \
            tests/Feature/Contracts/ContractTest.php \
            --filter="C17|C18"

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm security audit
        run: npm audit --omit=dev
        continue-on-error: true

      - name: Run tests (Vitest)
        run: npm run test

      - name: Type-check and build
        run: npm run build
